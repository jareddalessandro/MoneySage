name: tallyvio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tallyvio}
      POSTGRES_USER: ${POSTGRES_USER:-tallyvio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tallyvio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it won't clash with a locally installed Postgres
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # The version shown in the sidebar. Keep it the same as deploy/docker-compose.yml.
      APP_VERSION: "1.0.1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tallyvio}:${POSTGRES_PASSWORD:-tallyvio}@db:5432/${POSTGRES_DB:-tallyvio}
      AUTH_MODE: ${AUTH_MODE:-none}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5180}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      GOVERNING_LAW: ${GOVERNING_LAW:-}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-yahoo}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      PRICE_REFRESH_HOUR: ${PRICE_REFRESH_HOUR:-17}
      PRICE_REFRESH_MINUTE: ${PRICE_REFRESH_MINUTE:-30}
      PRICE_REFRESH_TZ: ${PRICE_REFRESH_TZ:-America/New_York}
      TZ: ${TZ:-America/Phoenix}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # FRONTEND_BIND=0.0.0.0 in .env opens the app to phones on your Wi-Fi (Vite proxies /api, so the
      # backend and database stay local). With AUTH_MODE=none there's no login, so only do that on a trusted network.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5180}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
