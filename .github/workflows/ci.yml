# Tests on every pull request and push to main. Production images are built on the server, not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tallyvio
          POSTGRES_PASSWORD: tallyvio
          POSTGRES_DB: tallyvio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tallyvio" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests (row-level security on)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tallyvio:tallyvio@localhost:5432/tallyvio
          # Same zone as the containers (docker-compose.yml): tests compare date.today() with the
          # household's today, which disagree on a UTC runner in the evening.
          TZ: America/Phoenix
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check and build
        working-directory: frontend
        run: npm ci && npm run build
